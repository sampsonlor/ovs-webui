name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLIC_API_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Go for generated public DTO checks
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24.19.0
          cache: true
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Type check
        run: pnpm typecheck
      - name: Full repository lint
        run: pnpm lint:ci
      - name: Contract and regression tests
        run: pnpm test:ci
      - name: Production build
        run: pnpm build
      - name: Retain regression test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regression-results
          path: test-results/unit.xml
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Isolated integration environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ci-integration
      deployment: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24.19.0
          cache: true
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: HTTP lifecycle and process restart tests
        run: pnpm test:integration
      - name: Retain integration test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-results
          path: test-results/integration.xml
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser workflow and UI templates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24.19.0
          cache: true
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --no-runtime
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Ports to Candidate and UI template browser checks
        run: pnpm test:browser
      - name: Retain browser results and failure evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-results
          path: |
            test-results/browser.xml
            test-results/browser/**/*.png
            test-results/browser/**/trace.zip
            test-results/browser/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  go-runtime:
    name: Go runtime (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify native architecture and Go formatting
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          go version
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet and native race tests
        env:
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          go vet ./...
          go mod verify
          mkdir -p test-results
          # Full production-cost Argon2id cases run under the race detector on
          # both architectures; the timeout is per package, not per HTTP call.
          go test -json -race -count=1 -timeout=180s ./... | tee test-results/go-tests.json
      - name: Bounded protocol fuzzing
        run: go test ./internal/ipc -run '^$' -fuzz '^FuzzDecodeStrict$' -fuzztime=3s -parallel=2
      - name: Build CGO-free daemon binaries
        run: |
          mkdir -p outputs/runtime
          go build -trimpath -ldflags="-X github.com/sampsonlor/ovs-webui/internal/buildinfo.Commit=$GITHUB_SHA" -o outputs/runtime/ovs-webd ./cmd/ovs-webd
          go build -trimpath -ldflags="-X github.com/sampsonlor/ovs-webui/internal/buildinfo.Commit=$GITHUB_SHA" -o outputs/runtime/ovs-mgrd ./cmd/ovs-mgrd
          go test -c -o outputs/runtime/storage.test ./internal/repository/sqlite
      - name: Real filesystem exhaustion and durable recovery
        run: sudo -- python3 tests/daemon/storage_full.py outputs/runtime/storage.test
      - name: Install ephemeral OVS test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openvswitch-switch
      - name: Real systemd, Unix peers and isolated OVS forwarding smoke test
        run: sudo -- python3 tests/daemon/smoke.py --bin-dir outputs/runtime
      - name: Real authentication, encrypted sessions and revocation across daemon restarts
        run: sudo -- python3 tests/daemon/authentication.py --bin-dir outputs/runtime
      - name: Encrypted TLS identity, fresh connection confirmation and real recovery deadline
        run: sudo -- python3 tests/daemon/tls_lifecycle.py --bin-dir outputs/runtime
      - name: Native OVSDB inventory, identity reconciliation and upstream schema matrix
        run: |
          for schema in 3.3.9 3.7.1 4.0.0; do
            sudo -- python3 tests/daemon/inventory.py --bin-dir outputs/runtime --schema-version "$schema"
          done
      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: go-runtime-${{ matrix.arch }}
          path: |
            test-results/go-tests.json
            test-results/go-runtime-smoke.json
            test-results/go-runtime-journal.log
            test-results/go-auth-smoke.json
            test-results/go-auth-journal.log
            test-results/go-tls-smoke.json
            test-results/go-tls-journal.log
            test-results/go-inventory-*.json
            test-results/go-inventory-*-journal.log
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: CI Gate
    if: always()
    needs: [quality, integration, browser, go-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          GO_RUNTIME_RESULT: ${{ needs.go-runtime.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$GO_RUNTIME_RESULT" = success
