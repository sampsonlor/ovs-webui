name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain and locked dependencies
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24.19.0
          cache: true
          require-lockfile: true
      - name: Type check
        run: pnpm typecheck
      - name: Product code lint
        run: pnpm lint:ci
      - name: Contract and regression tests
        run: pnpm test:ci
      - name: Production build
        run: pnpm build
      - name: Retain regression test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regression-results
          path: test-results/unit.xml
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Isolated integration environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ci-integration
      deployment: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain and locked dependencies
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24.19.0
          cache: true
          require-lockfile: true
      - name: HTTP lifecycle and process restart tests
        run: pnpm test:integration
      - name: Retain integration test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-results
          path: test-results/integration.xml
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: CI Gate
    if: always()
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$INTEGRATION_RESULT" = success
